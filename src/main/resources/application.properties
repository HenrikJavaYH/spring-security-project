spring.application.name=spring-security

spring.main.banner-mode=off
logging.level.org.springframework=ERROR

#RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USERNAME}
spring.rabbitmq.password=${RABBIT_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:file:.env[.properties]

# spring.datasource.initialization-mode=always
# spring.datasource.platform=postgres
spring.datasource.url=${CONNECTION_STRING_POSTGRESQL}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}

# Never share this information
CONNECTION_STRING_POSTGRESQL=
POSTGRESQL_USERNAME=
POSTGRESQL_PASSWORD=

remember.me.key=${REMEMBER_ME_KEY}

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


#Show debug password for debug user
#Disable for production
logging.level.org.springframework.boot.autoconfigure.security=INFO


